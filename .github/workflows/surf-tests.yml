name: SURF configuration integration

on:
  pull_request:
    branches: [prod-rebuild]
  push:
    branches: [surf/upgrade-1.8]

permissions:
  contents: read

jobs:
  configuration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check SURF configuration migration and resolved Compose model
        run: python -m unittest discover -s tests -p test_surf_upgrade.py -v
      - name: Check shell syntax
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
