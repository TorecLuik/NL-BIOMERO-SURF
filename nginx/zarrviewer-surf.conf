events {}

# SURF host nginx terminates TLS and supplies X-Forwarded-Proto.
# This inner frontend is published on loopback only.
http {
    map $http_x_forwarded_proto $public_scheme {
        default $scheme;
        https https;
        http http;
    }

    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    server {
        listen 4080;
        server_name _;
        client_max_body_size 0;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # Only an authorized X-Accel-Redirect can reach the store.
        location /_biomero_zarr_internal/ {
            internal;
            alias /data/;
            autoindex off;
            disable_symlinks on;
            etag on;
            types {
                application/json json zattrs zarray zgroup zmetadata;
            }
            default_type application/octet-stream;
            add_header X-Content-Type-Options nosniff always;
            add_header Cache-Control "private, max-age=300" always;
        }

        # A literal proxy_pass host is resolved once at startup, so recreating
        # omeroweb (make deploy, make up after an .env change) left this proxy
        # on the old container address and the login page answered 502. With a
        # variable, nginx looks the name up through Docker's embedded DNS.
        resolver 127.0.0.11 valid=10s;
        set $omeroweb_upstream http://omeroweb:4080;

        location / {
            proxy_pass $omeroweb_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $public_scheme;
            proxy_set_header Connection "";
            proxy_request_buffering off;
            proxy_cache off;
        }
    }
}
