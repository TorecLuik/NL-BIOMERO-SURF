services:
  opensearch:
    image: opensearchproject/opensearch:3
    container_name: opensearch
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      # The security plugin is off, but its audit log keeps writing regardless:
      # roughly 8.5M documents and 1.5GB a day of transport-layer records for a
      # plugin nothing here uses, which reached 12x the size of the actual logs
      # before anyone looked. It audits nothing meaningful with security
      # disabled, so turn it off too.
      - plugins.security.audit.type=noop
      - plugins.security.audit.config.enable_rest=false
      - plugins.security.audit.config.enable_transport=false
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - bootstrap.memory_lock=true
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=!Omero12345
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    # Loopback only. OpenSearch runs without authentication, so these must never
    # be reachable from outside the host; the stack reaches it over the compose
    # network, and nothing on the host uses 9300 or 9600 at all.
    ports:
      - "127.0.0.1:9200:9200"
      - "127.0.0.1:9300:9300"
      - "127.0.0.1:9600:9600"  # Performance Analyzer
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q 'green\\|yellow'"]
      interval: 30s
      timeout: 10s
      retries: 5
    extends:
      file: logging-defaults.yml
      service: default-logging

  # Use Fluent Bit for better OpenSearch compatibility
  fluent-bit:
    image: fluent/fluent-bit:2.2.0
    container_name: fluent-bit
    depends_on:
      opensearch-init:
        condition: service_completed_successfully
    volumes:
      - ./opensearch/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./opensearch/parsers.conf:/fluent-bit/etc/parsers.conf:ro
      - ./opensearch/normalize.lua:/fluent-bit/etc/normalize.lua:ro
      - ./logs:/logs:ro
      - fluent-bit-db:/fluent-bit/db
    command: /opt/fluent-bit/bin/fluent-bit --config=/fluent-bit/etc/fluent-bit.conf
    extends:
      file: logging-defaults.yml
      service: default-logging

  # Init container to set up index template before fluent-bit starts
  opensearch-init:
    image: curlimages/curl:latest
    container_name: opensearch-init
    depends_on:
      opensearch:
        condition: service_healthy
    volumes:
      - ./opensearch/init-opensearch.sh:/init.sh:ro
    entrypoint: ["/bin/sh", "/init.sh"]
    extends:
      file: logging-defaults.yml
      service: default-logging

  # Creates the Dashboards index pattern, so /logs opens on the logs rather than
  # on a "create an index pattern" screen. Kept apart from opensearch-init
  # because fluent-bit waits for that one, and this waits for Dashboards.
  dashboards-init:
    image: curlimages/curl:latest
    container_name: dashboards-init
    depends_on:
      opensearch-dashboards:
        condition: service_started
    volumes:
      - ./opensearch/init-dashboards.sh:/init.sh:ro
    entrypoint: ["/bin/sh", "/init.sh"]
    extends:
      file: logging-defaults.yml
      service: default-logging

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:3
    container_name: opensearch-dashboards
    depends_on:
      opensearch:
        condition: service_healthy
    # Loopback only: nginx serves it under /logs behind basic auth, which a
    # directly reachable 5601 would bypass.
    ports:
      - "127.0.0.1:5601:5601"
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
      - SERVER_HOST=0.0.0.0
      - SERVER_BASEPATH=/logs
      - SERVER_REWRITEBASEPATH=true
    volumes:
      - opensearch-dashboards-data:/usr/share/opensearch-dashboards/data
    extends:
      file: logging-defaults.yml
      service: default-logging

volumes:
  opensearch-data:
  fluent-bit-db:
  opensearch-dashboards-data:
